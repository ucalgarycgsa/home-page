<!doctype html>
<html lang="en" data-lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" href="%BASE_URL%brand/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/apple-touch-icon.png" />
    <!--app-head-->
    <script>
      // Decide language before first paint: ?lang= → saved choice → browser language → English.
      // Locales: en, zh-Hans (简体), zh-Hant (繁體). Keep in step with normalizeLang() in src/i18n/index.tsx.
      ;(function () {
        function norm(v) {
          if (!v) return null
          v = String(v).trim().toLowerCase()
          if (v === 'en' || v.indexOf('en-') === 0) return 'en'
          if (v === 'zh-hant' || v.indexOf('zh-hant-') === 0 || v === 'hant' || v === 'tc' || /^zh-(hk|mo|tw)\b/.test(v)) return 'zh-Hant'
          if (v === 'zh' || v === 'zh-hans' || v.indexOf('zh-') === 0) return 'zh-Hans'
          return null
        }
        var lang = 'en'
        try {
          var q = norm(new URLSearchParams(location.search).get('lang'))
          var saved = norm(localStorage.getItem('cgsa-lang'))
          var browser = norm((navigator.languages && navigator.languages[0]) || navigator.language || '')
          if (q) {
            lang = q
            localStorage.setItem('cgsa-lang', q)
          } else if (saved) lang = saved
          else if (browser) lang = browser
        } catch (e) {}
        var root = document.documentElement
        root.lang = lang
        root.setAttribute('data-lang', lang)
        // Prerendered HTML is English; hide it for a moment while Chinese mounts, never longer than 1.2s.
        if (lang !== 'en') {
          root.classList.add('lang-pending')
          setTimeout(function () { root.classList.remove('lang-pending') }, 1200)
        }
      })()
    </script>
    <style>.lang-pending #root{visibility:hidden}</style>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
